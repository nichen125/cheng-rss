name: CI

# 触发方式：**打标签时**自动跑，其余情况手动。
#
# 为什么不用 push 触发（2026-11-06 需求方决定）：
#   验收功能先本地跑通，再去 CI 跑；CI 资源有限，在 CI 侧调稳之前避免
#   "每次 push 都触发"。绝大多数 push 只改文档或注释，不需要跑完整验收。
#
# 为什么挂在 tag 上：打标签意味着要发版，那时必须有一份「干净 runner 上的
# 结论」，而本机能过不等于 CI 能过（字体、浏览器路径、Node 补丁版本都会漂）。
# 挂在 tag 上等于「发版即验」，且与 release.yml 天然同步。
#
# 日常流程因此变成：
#   1. 本地 ./scripts/verify-all.mjs 跑绿
#   2. 打 tag 并推送 → ci.yml 与 release.yml 同时跑
#   3. 想单独验而不发版时，手动触发本 workflow
#
# 注意：GitHub Actions **不认** commit message 里的 `[skip ci]`
# （那是 GitLab / Cirrus 的行为），要跳过只能靠不触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同一分支上新的 push 取消旧的运行，节省额度也避免"旧提交红了"的混乱
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 scripts/lib/toolchain.sh 的默认值保持同步
  CHENG_RSS_NODE_VERSION: v24.13.0

jobs:
  verify:
    name: 验收（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    # 全量验收本机 750s，CI 上首次含下载约 15~20 分钟。
    # 给足上限是为了防"挂死但没有输出"，而不是为了容纳正常时长。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 两个平台都跑：.sh / .ps1 是两套实现，只验一个平台会漏掉
        # 另一个平台的路径处理 bug（历史上就漏过一次，见 PLAN §16.1）
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 缓存项目内 Node 运行时：bootstrap 每次要下 35MB，两平台两次
      - name: 缓存项目内 Node
        uses: actions/cache@v4
        with:
          path: .toolchain/node
          key: toolchain-${{ runner.os }}-${{ env.CHENG_RSS_NODE_VERSION }}

      - name: 引导项目内 Node
        shell: bash
        run: bash scripts/bootstrap.sh

      # 依赖缓存：key 含 lockfile 哈希，锁文件变了才重装
      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: |
            .cache/npm
            node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # 用探测代替按平台拼路径。
      #
      # 这里踩过两次，都是"两平台路径形态不同"：
      #   1. bin/npm 是 `#!/usr/bin/env node`，依赖 PATH 里有 node，一碰就 127。
      #      Windows 反而不报错（npm.cmd 用 %~dp0 自己找 node.exe），
      #      于是同一个 bug 在第二个平台上被掩盖。
      #   2. 改用 npm-cli.js 之后又踩第二次：npm 的 JS 入口在两个包里位置不同
      #        Windows 包（扁平）    node_modules/npm/bin/npm-cli.js
      #        Linux 包（有 lib/）   lib/node_modules/npm/bin/npm-cli.js
      #      写死 Windows 那个 → Linux 上必然 MODULE_NOT_FOUND。
      #
      # 所以把路径决定权收进 scripts/ci-env.sh（它复用 toolchain.sh 的探测），
      # 后续步骤只用 "$NODE_BIN" 与 "$NPM_CLI"，不再出现任何平台分支。
      - name: 准备 node / npm 路径
        shell: bash
        run: bash scripts/ci-env.sh

      - name: 安装依赖
        shell: bash
        run: '"$NODE_BIN" "$NPM_CLI" ci --no-audit --no-fund'

      # 服务端 + 客户端两套 tsconfig 都要查。
      # 此前只跑 `tsc --noEmit`（服务端），tsconfig.client.json 从未在 CI 里检查过。
      - name: 类型检查（服务端 + 客户端）
        shell: bash
        run: '"$NODE_BIN" "$NPM_CLI" run typecheck:all'

      - name: 构建前端
        shell: bash
        run: '"$NODE_BIN" scripts/build-client.mjs'

      - name: 打包前端 zip
        shell: bash
        run: '"$NODE_BIN" scripts/pack-client-zip.mjs'

      # docker-path 要验 Dockerfile 里 `build-sea --target linux-x64` 那一步，
      # 需要一个 linux 的 node 当 SEA 注入底本（约 25MB，从 nodejs.org 下）。
      #
      # 这一步的性质是**尽力而为**：拿到就完整跑 docker-path，拿不到就降级
      # （Docker 镜像那个 job 只在 ubuntu 上跑，Windows 这里本就是交叉检查）。
      #
      # 为什么不能让它的失败拖垮整个 job（实测踩过）：
      #   第一版只给 Linux 加这步，Windows 恒 FAIL —— 于是去掉条件改成两平台都跑。
      #   结果 Windows 上这一步 4 秒就退出，把后面「跑全部验收（57 个脚本）」
      #   整个 skipped 掉：**一条产品断言都没跑**，却报了个红。
      #   下载失败是网络问题，不该等价于"代码坏了"。
      #
      # 所以：continue-on-error 让 job 继续，再用一个 step 输出判断是否需要
      # 给 verify-all 加 --allow-skip-docker-artifact（缺底本时它默认报 FAIL）。
      - name: 取 linux node（供 docker-path 验证 linux 产物）
        id: linuxnode
        continue-on-error: true
        shell: bash
        run: '"$NODE_BIN" scripts/fetch-linux-node.mjs'

      - name: 判断底本是否就绪
        id: linuxnode-check
        shell: bash
        run: |
          BASE=".tmp/linuxnode/node-v${CHENG_RSS_NODE_VERSION:-v24.13.0}-linux-x64/bin/node"
          if [ -f "$BASE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "底本就绪：$BASE"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没取到 linux node 底本，docker-path 的 ELF 产物断言将跳过（不影响其余 56 个脚本）"
          fi

      # 用 verify-all 而不是自己写循环。
      #
      # 曾经的写法是 `for f in scripts/verify/m0-*.mjs`，只跑 10 个（共 57 个），
      # m1~m4 全都不在门禁里；而且缺 verify-all 已有的三样东西：
      # 单脚本 10 分钟硬超时、环境抖动重试一次、结尾 .tmp 清理。
      #
      # 缺底本时补 --allow-skip-docker-artifact：docker-path 的默认行为是
      # "未执行即 FAIL"（有意的，避免 SKIP 被读成 PASS），但这里缺底本已被
      # 上一步显式告警，不该再让整个套件红。
      #
      # tee 一份到文件：下一步要把"哪个脚本红了"变成注解。
      # 默认日志只有 exit code 1，而下载完整日志需要仓库 admin 权限
      # （实测匿名 API 返回 403），注解是匿名可读的唯一通道。
      - name: 跑全部验收（57 个脚本）
        shell: bash
        run: |
          set -o pipefail
          EXTRA=""
          if [ "${{ steps.linuxnode-check.outputs.ready }}" != "true" ]; then
            EXTRA="--allow-skip-docker-artifact"
          fi
          "$NODE_BIN" scripts/verify-all.mjs $EXTRA 2>&1 | tee .tmp/verify-out.log

      # 把失败的脚本名推到 Actions 页面。
      # 泛泛说"验收失败"没有用 —— 要能一眼看出是哪个脚本、哪条断言。
      #
      # 注意：verify-all 的汇总表每行都是「名字 + 耗时」的格式，
      # 直接按这个模式 grep 会把**全部 57 个**都当成失败（第一版就错在这，
      # 两个平台报出完全相同的 10 个"失败"，一眼就该看出那不是真失败）。
      # 必须只看行首的 FAIL 标记，并且先剥掉 ANSI 色码。
      - name: 失败原因（注解）
        if: failure()
        shell: bash
        run: |
          if [ -f .tmp/verify-out.log ]; then
            # 剥色码后落一份纯文本，后续判断才可靠
            sed -E 's/\x1b\[[0-9;]*m//g' .tmp/verify-out.log > .tmp/verify-plain.log

            echo "--- 验收汇总 ---"
            sed -n '/验收汇总/,/^$/p' .tmp/verify-plain.log || true

            # 汇总表里以 FAIL 开头的行 → 取第一列名字
            awk '$1 == "FAIL" {print $2}' .tmp/verify-plain.log \
              | grep -E '\.mjs$' | sort -u > .tmp/failed.txt || true

            if [ -s .tmp/failed.txt ]; then
              while read -r f; do
                echo "::error::验收脚本失败: $f"
              done < .tmp/failed.txt
            else
              echo "::error::没有解析出失败脚本名 —— 可能是崩溃/超时，看下面的日志尾"
            fi

            # 把每一条失败断言连同实测值做成注解。
            #
            # 只报脚本名不够：UI 类失败几乎都是"数值差一点点"（字体度量不同），
            # 必须看到**期望值与实际值**才能判断是环境差异还是实现坏了。
            # 而完整日志要仓库 admin 权限才能下载，注解是唯一匿名可读的通道。
            #
            # 失败断言的格式（harness.mjs 的 summary）：
            #   FAIL  <描述>
            #         <detail: "lab再: 期望 X，实际 Y">
            #
            # 两个坑（都实测过，用 .tmp/t-awk2.sh 那种假日志复现）：
            #   ① 汇总表行也长成「FAIL  <名字>.mjs  <耗时>s (第 N 次)」，
            #      不排掉会多报一条「断言失败: m1-07-folders.mjs  1.4s」，
            #      看着像断言，其实是脚本级结论 —— 会让人以为有两处失败。
            #   ② 断言行本身不带脚本名，连着报几条就分不清是哪一份日志。
            #      靠 `▶ <脚本>` 记号记住当前脚本，前缀到每条注解上。
            awk '
              /^▶ / { script = $2; next }
              /^[[:space:]]+FAIL[[:space:]]/ {
                line = $0
                if (line ~ /\.mjs[[:space:]]+[0-9.]+s/) next
                sub(/^[[:space:]]+FAIL[[:space:]]+/, "", line)
                desc = line
                if ((getline nxt) > 0 && nxt ~ /^[[:space:]]{6,}/) {
                  sub(/^[[:space:]]+/, "", nxt)
                  print script ": " desc " || " nxt
                } else {
                  print script ": " desc
                  # 回退一行不好做，丢掉这条的 detail 可接受
                }
              }
            ' .tmp/verify-plain.log | head -25 | while IFS= read -r line; do
              # ::error:: 里的换行必须转义，否则注解会被截断
              msg=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-800)
              echo "::error::断言失败: $msg"
            done

            echo "--- 失败断言（最多 40 行）---"
            grep -E '^  - ' .tmp/verify-plain.log | head -40 || true

            echo "--- 日志尾 60 行 ---"
            tail -60 .tmp/verify-plain.log

            {
              echo "### 验收失败"
              echo
              echo "**失败的脚本**："
              echo
              if [ -s .tmp/failed.txt ]; then
                sed 's/^/- `/; s/$/`/' .tmp/failed.txt
              else
                echo "（未能解析，见日志）"
              fi
              echo
              echo "<details><summary>失败断言</summary>"
              echo
              echo '```'
              grep -E '^  - ' .tmp/verify-plain.log | head -40 || echo '（无）'
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "::error::验收在产出日志之前就退出了（可能是崩溃或超时）"
          fi
          echo "::error::本机复现：node scripts/verify-all.mjs --keep-tmp 后看 .tmp/verify"

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cheng-rss:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像体积
        run: docker image inspect cheng-rss:ci --format='{{.Size}}' | awk '{printf "%.0f MB\n", $1/1024/1024}'

      # 容器冒烟：首页 + 健康 + doctor 三条都要过。
      #
      # 曾经这里 curl 连不上（exit 7）。根因是 Dockerfile 里 chown 在 VOLUME
      # 之前，/app/data 被建成了 root 所有，而进程是 uid 10001 —— 写不进库，
      # serve 退出。现在 Dockerfile 已改为先 mkdir 再 chown。
      - name: 容器冒烟（首页 + 健康检查 + doctor）
        run: |
          set -e
          docker run -d --name cheng-rss-ci -p 3311:3000 cheng-rss:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3311/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:3311/api/health
          echo
          echo "--- 首页必须含 React 挂载点（静态资源内嵌校验）---"
          curl -fsS http://127.0.0.1:3311/ | grep -q 'id="root"'
          echo "OK"
          echo "--- doctor（容器内，带 --url 探测）---"
          docker exec cheng-rss-ci /app/cheng-rss doctor \
            --url http://127.0.0.1:3000 --quiet
          echo "doctor OK"

      # 容器能起来不等于数据目录可写。单独验一次：
      # 以容器内用户写一个文件，证明 /app/data 属主正确。
      - name: 数据目录对非 root 用户可写
        run: |
          set -e
          docker exec cheng-rss-ci sh -c 'touch /app/data/.write-probe && rm /app/data/.write-probe'
          echo "OK: uid 10001 可写 /app/data"

      - name: 容器日志
        if: failure()
        run: docker logs cheng-rss-ci

      - name: 清理
        if: always()
        run: docker rm -f cheng-rss-ci || true
