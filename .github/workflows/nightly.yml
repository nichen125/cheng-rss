name: Nightly

# 每日重跑同一套验收。
#
# 用途只有一个：发现 runner 镜像漂移。字体、Chromium 路径、Node 补丁版本
# 这些变化会让 UI 断言悄悄偏移，而它们跟代码无关。
#
# **不做真实外网回归**（原 PLAN 的规划是拉真实 RSSHub 路由库）。
# 理由：整套验收的价值在于自封闭 —— 57 个脚本没有一个向外发请求，
# AI 那 5 个都是起本地 mock 上游。引入真实外网会让它变 flaky，
# 而 flaky 的门禁等于没有门禁：红了没人信，绿了也不代表什么。
#
# 红了通常意味着"环境变了"，不是"代码坏了"，所以不阻塞主分支。
on:
  schedule:
    # 每天 19:00 UTC = 次日 03:00 Asia/Shanghai（低峰）
    - cron: "0 19 * * *"
  workflow_dispatch:

env:
  CHENG_RSS_NODE_VERSION: v24.13.0

jobs:
  drift:
    name: 环境漂移检测（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 环境快照（漂移时用来对照）
        shell: bash
        run: |
          echo "=== OS ==="
          uname -a || true
          echo "=== 浏览器 ==="
          ls -la /usr/bin/google-chrome /usr/bin/chromium 2>/dev/null || true
          ls -la "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" 2>/dev/null || true
          echo "=== 中文字体（UI 断言依赖它）==="
          fc-list 2>/dev/null | grep -iE "noto.*cjk|wqy|source han" | head -10 || echo "（fc-list 不可用）"

      - name: 引导项目内 Node
        shell: bash
        run: bash scripts/bootstrap.sh

      - name: 准备 node / npm 路径
        shell: bash
        run: bash scripts/ci-env.sh

      - name: Node 版本（漂移时用来对照）
        shell: bash
        run: '"$NODE_BIN" -v'

      - name: 安装依赖
        shell: bash
        run: '"$NODE_BIN" "$NPM_CLI" ci --no-audit --no-fund'

      - name: 构建前端
        shell: bash
        run: |
          "$NODE_BIN" scripts/build-client.mjs
          "$NODE_BIN" scripts/pack-client-zip.mjs

      # 与 ci.yml 保持同一套写法，理由见 ci.yml 那段注释：
      # 取底本是尽力而为（网络下载），拿到就跑完整的 docker-path，拿不到就降级。
      # 不能让一次下载失败把「全部验收」整个 skipped 掉 —— 那样一条产品断言
      # 都没跑，却报了个红，而 nightly 的用途恰恰是"看断言有没有漂移"。
      - name: 取 linux node（供 docker-path）
        id: linuxnode
        continue-on-error: true
        shell: bash
        run: '"$NODE_BIN" scripts/fetch-linux-node.mjs'

      - name: 判断底本是否就绪
        id: linuxnode-check
        shell: bash
        run: |
          BASE=".tmp/linuxnode/node-v${CHENG_RSS_NODE_VERSION:-v24.13.0}-linux-x64/bin/node"
          if [ -f "$BASE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "底本就绪：$BASE"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没取到 linux node 底本，docker-path 的 ELF 产物断言将跳过（不影响其余 56 个脚本）"
          fi

      - name: 全部验收
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.linuxnode-check.outputs.ready }}" != "true" ]; then
            EXTRA="--allow-skip-docker-artifact"
          fi
          "$NODE_BIN" scripts/verify-all.mjs $EXTRA

      # 漂移时的提示：告诉看日志的人"这多半是环境问题"
      - name: 失败提示
        if: failure()
        shell: bash
        run: |
          echo "::warning::nightly 失败通常意味着 runner 镜像漂移（字体/浏览器/Node），不是代码坏了"
          echo "::warning::先看上面的「环境快照」，与上次成功运行的快照对比"
          echo "::warning::若确认是环境变化导致的断言偏移，按 PLAN 附录 A.5 单独提交调整阈值并写明理由"
