services:
  cheng-rss:
    build: .
    image: cheng-rss:local
    container_name: cheng-rss
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      # 数据目录在容器内固定为 /app/data，由下面的 volume 映射出来
      DATA_DIR: /app/data
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # 模型配置（M2 起使用）。key 通过 .env 传入，不写进镜像
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # --url 让它真的探一次 HTTP，而不是只读磁盘上的库。
      # 不加的话，进程活着但服务挂死时仍会被报成 healthy（PLAN §16.3）。
      test: ["CMD", "/app/cheng-rss", "doctor", "--url", "http://127.0.0.1:3000", "--quiet"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3
    # 单进程 SQLite，不需要额外权限
    security_opt:
      - no-new-privileges:true
